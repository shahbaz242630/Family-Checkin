# CI for every pull request and push to master.
#
# Same baseline as our other repos: read-only GITHUB_TOKEN, every action pinned
# to a full commit SHA, one "Verify" gate (lint, typecheck, schema, build,
# tests with coverage) plus "Security scans" (secrets, workflow hygiene,
# dependency audit) and "Dependency review" on pull requests. These three job
# names are the required status checks on the master ruleset.
name: CI

on:
  # `types` is spelled out because taking a draft PR out of draft only fires
  # `ready_for_review`, which is not in the default set.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a master run so every merged
  # commit ends with a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Prisma 7 loads DATABASE_URL from prisma.config.ts even for `prisma validate`
  # and `prisma generate`; no database is contacted by those commands.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheapest gate, so it runs first. The pre-commit hook formats staged
      # files, but it is skipped inside linked worktrees and by --no-verify, so
      # unformatted code reached master three waves running (CB-087).
      - name: Format check
        run: npm run format:check

      # A fresh install does not produce the Prisma client (Prisma 7 with
      # prisma.config.ts skips the postinstall generate), and typecheck, build,
      # and the backend specs all import it.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma schema validation
        run: npm run prisma:validate

      # CB-027: catches ${} interpolation in eas.json and a missing
      # projectId/owner/versionCode/buildNumber. Both failures are invisible
      # until a build reaches a device, so they are checked here instead.
      - name: Mobile config check
        run: npm run check:mobile-config

      - name: Build backend
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # zizmor uploads SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the commits in this push/PR, so it needs history.
          fetch-depth: 0

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Workflow hygiene (SHA pins, minimal permissions, no PR secrets)
        run: npm run security:workflows

      - name: Secret pattern scan (tracked files)
        run: npm run security:secrets

      - name: Production dependency audit (high/critical, reviewed allowlist)
        run: npm run security:deps

      - name: Workflow security lint (zizmor)
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks PRs that introduce a high/critical vulnerable dependency.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Reviewed exceptions. Must match security/dependency-audit-allowlist.json;
          # scripts/dependency-audit.test.mjs fails when the two drift apart.
          allow-ghsas: GHSA-3f6p-5ww8-9rcr, GHSA-535w-7cp7-47q4, GHSA-5p2g-fcmc-qvqq, GHSA-6g55-p6wh-862q, GHSA-ggr8-5vv4-36mx, GHSA-qfvm-cv95-jqjf, GHSA-r28c-9q8g-f849, GHSA-w3rx-r6r6-pgpr, GHSA-wc9g-mqfw-jrwm
