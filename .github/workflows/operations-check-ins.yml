# Hosted scheduler for check-in runs. Calls the backend's operations endpoint
# every 10 minutes with the cron secret; it deliberately never receives the
# Supabase service-role key.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity ("disabled_inactivity"). Re-enable it from the Actions tab or with
# `gh workflow enable operations-check-ins.yml` once the backend is hosted.
name: Operations check-ins

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: operations-check-ins
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-check-ins:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run operations check-ins
        run: |
          if [ -z "$OPERATIONS_CHECK_INS_RUN_URL" ] || [ -z "$OPERATIONS_CRON_SECRET" ]; then
            echo "::notice::Operations scheduler secrets are not configured; skipping check-in run."
            exit 0
          fi

          npm --prefix apps/backend run operations:check-ins
        env:
          OPERATIONS_CHECK_INS_RUN_URL: ${{ secrets.OPERATIONS_CHECK_INS_RUN_URL }}
          OPERATIONS_CRON_SECRET: ${{ secrets.OPERATIONS_CRON_SECRET }}

      # Expo answers a push with a ticket and reports the delivery receipt later, so the receipts are drained on
      # their own schedule instead of only at the start of the next send: without this a `DeviceNotRegistered`
      # token stays active through a quiet period (CB-085). `always()` so a failed tick does not leave the
      # receipts unread; the step itself is a no-op until the URL secret exists.
      - name: Run operations push receipts
        if: always()
        run: |
          if [ -z "$OPERATIONS_PUSH_RECEIPTS_RUN_URL" ] || [ -z "$OPERATIONS_CRON_SECRET" ]; then
            echo "::notice::Operations push-receipt secrets are not configured; skipping receipt run."
            exit 0
          fi

          npm --prefix apps/backend run operations:push-receipts
        env:
          OPERATIONS_PUSH_RECEIPTS_RUN_URL: ${{ secrets.OPERATIONS_PUSH_RECEIPTS_RUN_URL }}
          OPERATIONS_CRON_SECRET: ${{ secrets.OPERATIONS_CRON_SECRET }}
